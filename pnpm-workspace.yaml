packages:
  - apps/*
  - packages/*
  - e2e
# Build-script policy (pnpm supply-chain guard): only esbuild needs its
# install script; cpu-features/ssh2 are optional native accelerators for
# testcontainers' ssh tunnel (unused), protobufjs' postinstall is a no-op.
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
overrides:
  # GHSA-rgw5-rvv9-x895 (high): brace-expansion <5.0.9 blows up on nested
  # braces. It reaches us only under minimatch 10 (@fastify/static's glob and
  # archiver's readdir-glob); older minimatch lines are on the unaffected 2.x,
  # so the pin is scoped rather than global. Drop it once minimatch ships the
  # bump itself.
  minimatch@10>brace-expansion: '>=5.0.9'
  # GHSA-7p8r-x3mc-p8w7 (high): fast-uri reads a backslash as an authority
  # introducer, so a URL parsed here and fetched elsewhere can disagree about
  # the host. It arrives under fastify, its ajv compiler and @fastify/swagger,
  # and both release lines are affected — hence two pins rather than one range.
  # Patch-level bumps of a parser, so they need no coordination with fastify —
  # but each pin keeps its own major ceiling, or an unbounded `>=3.1.5` hands
  # ajv (which asks for ^3.0.1) the v4 API instead of the patch it needs.
  fast-uri@3: '>=3.1.5 <4'
  fast-uri@4: '>=4.1.2 <5'
minimumReleaseAgeExclude:
  # MCP TypeScript SDK v2 — spec-day releases (2026-07-28), pinned exact.
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - '@modelcontextprotocol/server@2.0.0'
  - '@tiptap/core@3.29.1'
  - '@tiptap/extension-blockquote@3.29.1'
  - '@tiptap/extension-bold@3.29.1'
  - '@tiptap/extension-bubble-menu@3.29.1'
  - '@tiptap/extension-bullet-list@3.29.1'
  - '@tiptap/extension-code-block@3.29.1'
  - '@tiptap/extension-code@3.29.1'
  - '@tiptap/extension-document@3.29.1'
  - '@tiptap/extension-dropcursor@3.29.1'
  - '@tiptap/extension-floating-menu@3.29.1'
  - '@tiptap/extension-gapcursor@3.29.1'
  - '@tiptap/extension-hard-break@3.29.1'
  - '@tiptap/extension-heading@3.29.1'
  - '@tiptap/extension-horizontal-rule@3.29.1'
  - '@tiptap/extension-italic@3.29.1'
  - '@tiptap/extension-link@3.29.1'
  - '@tiptap/extension-list-item@3.29.1'
  - '@tiptap/extension-list-keymap@3.29.1'
  - '@tiptap/extension-list@3.29.1'
  - '@tiptap/extension-ordered-list@3.29.1'
  - '@tiptap/extension-paragraph@3.29.1'
  - '@tiptap/extension-strike@3.29.1'
