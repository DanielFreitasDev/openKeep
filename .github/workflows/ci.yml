name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start Postgres
        run: docker compose -f docker/compose.dev.yml up -d --wait
      - name: Prepare env + migrate
        run: |
          cp .env.example .env
          sed -i "s/^BETTER_AUTH_SECRET=.*/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/" .env
          pnpm db:migrate
      - name: Install Playwright browsers
        run: pnpm --filter @openkeep/e2e exec playwright install --with-deps chromium
      - name: Run E2E suite
        run: CI=1 pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f docker/Dockerfile -t openkeep:ci .
      - name: Smoke-check the image entrypoint
        # No DB in this job — a config validation failure at boot proves the
        # bundle loads and env parsing runs (a crash on import would differ).
        run: |
          set +e
          out=$(docker run --rm -e BETTER_AUTH_SECRET=short openkeep:ci 2>&1)
          echo "$out"
          echo "$out" | grep -qi "invalid\|BETTER_AUTH_SECRET\|DATABASE_URL"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
