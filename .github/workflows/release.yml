name: Release

# Every push to main that carries a releasable commit (feat/fix/perf, or a
# BREAKING CHANGE) is versioned, tagged, released and published automatically.
# Pushes with only chore/docs/test/refactor commits stop after the CI gate.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Dry run: learn the next version before building anything, so the image can
  # carry it and a failed build leaves no tag, no release and no version bump.
  plan:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      # semantic-release checks for push rights even in dry-run mode; it does
      # not write anything here.
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # GHCR refs must be lowercase; owner and repo here are not.
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The version lands in this step's outputs via the exec plugin's
      # verifyReleaseCmd; it stays empty when nothing is releasable.
      - id: semrel
        run: pnpm exec semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        env:
          VERSION: ${{ steps.semrel.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            echo "No releasable commits since the last tag — stopping here." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing **v$VERSION**." >> "$GITHUB_STEP_SUMMARY"
          fi

  # One native runner per architecture (free for public repos) — an emulated
  # arm64 build of the web bundle takes tens of minutes.
  build:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Normalize platform name
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      # Not committed here — the release job makes the same edit in the commit
      # it tags. This only ensures the image reports its own released version.
      - name: Stamp the release version
        run: node scripts/set-version.mjs "${{ needs.plan.outputs.version }}"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ needs.plan.outputs.image }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed by digest only; the merge job attaches the human-readable tags
      # to the manifest list that spans both architectures.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=${{ needs.plan.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${VERSION%.*}" \
            -t "${IMAGE}:${VERSION%%.*}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        id: inspect
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ needs.plan.outputs.image }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  # The real run: bumps the versions, refreshes CHANGELOG.md and the OpenAPI
  # spec, commits, tags, and publishes the GitHub Release with its assets.
  release:
    needs: [plan, merge]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Regenerating the OpenAPI spec during prepare needs the integration
      # harness, which spins a throwaway Postgres via Testcontainers.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
